# SonarQube Project Configuration
# This file provides additional SonarQube settings
# Main configuration is in build.gradle sonar block

# Project identification
sonar.projectKey=Consentidos_consentidos
sonar.organization=consentidos
sonar.projectName=Consentidos Veterinaria
sonar.projectVersion=0.0.1-SNAPSHOT

# Source and test directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.source=17
sonar.java.target=17

# Binary directories
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

# Coverage reports
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Exclusions
sonar.exclusions=**/*Application.java,**/config/**,**/dto/**,**/entity/**

# Test exclusions
sonar.test.exclusions=**/*Test.java,**/*Tests.java,**/Test*.java

# Quality gate settings
sonar.qualitygate.wait=true

# Language-specific settings
sonar.java.coveragePlugin=jacoco

# Duplications
sonar.cpd.java.minimumTokens=50

# Issues
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S106
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S1118
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*Application.java