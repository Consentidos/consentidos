# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/consentidos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# MVC - allow NoHandlerFoundException to propagate to @ControllerAdvice
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Auth - Google ID token verification
auth.google.client-ids=${AUTH_GOOGLE_CLIENT_IDS:}
auth.google.allowed-domains[0]=gmail.com

# Auth - Redis / Lettuce (Cloud / dev)
auth.redis.host=${AUTH_REDIS_HOST:}
auth.redis.port=${AUTH_REDIS_PORT:0}
auth.redis.username=${AUTH_REDIS_USERNAME:default}
auth.redis.password=${AUTH_REDIS_PASSWORD:}
auth.redis.ssl=${AUTH_REDIS_SSL:true}
auth.redis.database=${AUTH_REDIS_DATABASE:0}
auth.redis.timeout-seconds=${AUTH_REDIS_TIMEOUT_SECONDS:10}
auth.redis.key-prefix=${AUTH_REDIS_KEY_PREFIX:consentidos:auth}

# Auth - Login attempts
auth.login-attempts.max-attempts=${AUTH_LOGIN_ATTEMPTS_MAX:3}
auth.login-attempts.window-seconds=${AUTH_LOGIN_ATTEMPTS_WINDOW_SECONDS:120}
auth.login-attempts.lockout-seconds=${AUTH_LOGIN_ATTEMPTS_LOCKOUT_SECONDS:900}

# Auth - RS256 backend JWT (access 15m, refresh 7d)
auth.token.issuer=${AUTH_TOKEN_ISSUER:consentidos-auth}
auth.token.audience=${AUTH_TOKEN_AUDIENCE:consentidos-web}
auth.token.access-ttl-seconds=${AUTH_TOKEN_ACCESS_TTL_SECONDS:900}
auth.token.refresh-ttl-seconds=${AUTH_TOKEN_REFRESH_TTL_SECONDS:604800}
auth.token.private-key-pem=${AUTH_TOKEN_PRIVATE_KEY_PEM:}
auth.token.public-key-pem=${AUTH_TOKEN_PUBLIC_KEY_PEM:}


