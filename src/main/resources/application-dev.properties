# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/consentidos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# MVC - allow NoHandlerFoundException to propagate to @ControllerAdvice
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Auth - Google ID token verification
auth.google.client-ids=${AUTH_GOOGLE_CLIENT_IDS:}

# Auth - RS256 backend JWT (access 10m, refresh 1h)
auth.token.issuer=${AUTH_TOKEN_ISSUER:consentidos-auth}
auth.token.audience=${AUTH_TOKEN_AUDIENCE:consentidos-web}
auth.token.access-ttl-seconds=${AUTH_TOKEN_ACCESS_TTL_SECONDS:600}
auth.token.refresh-ttl-seconds=${AUTH_TOKEN_REFRESH_TTL_SECONDS:3600}
auth.token.private-key-pem=${AUTH_TOKEN_PRIVATE_KEY_PEM:}
auth.token.public-key-pem=${AUTH_TOKEN_PUBLIC_KEY_PEM:}

# Auth - Pre-registered users (temporary source until admin/tables are implemented)
auth.users.pre-registered[0].google-sub=${AUTH_USER_0_GOOGLE_SUB:}
auth.users.pre-registered[0].email=${AUTH_USER_0_EMAIL:}
auth.users.pre-registered[0].display-name=${AUTH_USER_0_DISPLAY_NAME:}
auth.users.pre-registered[0].active=${AUTH_USER_0_ACTIVE:true}

