# Pre-commit configuration for Java project
repos:
  - repo: local
    hooks:
      - id: gradle-compile-and-lint
        name: Check Compilation, Linting and Code Style
        entry: ./gradlew compileJava compileTestJava checkstyleMain
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: gradle-full-test-suite
        name: Run Full Test Suite with Coverage
        entry: ./gradlew clean test jacocoTestReport jacocoTestCoverageVerification
        language: system
        pass_filenames: false
        stages: [pre-push]
